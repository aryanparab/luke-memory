<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luke · Quick recall</title><link rel="stylesheet" href="/assets/panel.css"></head><body>
<header><span class="mark">l<span>u</span></span><div class="identity"><strong>Luke</strong><small id="connection">Connecting to your memory…</small></div><button id="library" title="Open memory library" aria-label="Open memory library">↗</button><button id="hide" title="Hide · Escape" aria-label="Hide chat">×</button></header>
<nav aria-label="Quick panel"><button class="active" data-tab="chat">Recall</button><button data-tab="memories">Memories</button><button data-tab="tasks">Tasks <span id="task-count">0</span></button></nav><div id="error" role="alert" hidden></div>
<section id="chat" class="view"><div id="messages" role="log" aria-live="polite"><div class="welcome"><span class="eyebrow">RIGHT WHERE YOU LEFT OFF</span><h1>A thought away.</h1><p>Ask about a note, something you were working on, or what you meant to follow up.</p><button id="starter">What was I working on? ↗</button></div></div><form id="chat-form"><label class="sr-only" for="question">Ask your memory</label><div class="compose"><textarea id="question" rows="2" maxlength="2000" required placeholder="Ask Luke about your day…"></textarea><button id="send" aria-label="Send question">↑</button></div><small id="disclosure">Your memory stays on this computer.</small></form></section>
<section id="memories" class="view" hidden><form id="search-form"><label class="sr-only" for="query">Search memories</label><input id="query" placeholder="Find a note or a detail…"><button>Find</button></form><details class="note"><summary>+ Save a quick memory</summary><form id="note-form"><label class="sr-only" for="note">Memory text</label><textarea id="note" required maxlength="12000" rows="3" placeholder="Something worth remembering…"></textarea><button>Save memory</button></form></details><div id="records" class="records"></div></section>
<section id="tasks" class="view" hidden><form id="task-form"><label class="sr-only" for="task-title">New task</label><input id="task-title" placeholder="A small thing to follow up…" maxlength="300" required><button>Add</button></form><div id="task-list" class="records"></div></section><footer><span id="capture">○ Capture paused</span><span>Click away to tuck Luke back.</span></footer><script src="/assets/panel.js"></script></body></html>
